<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (SVG works in every modern browser; scales crisply at any size) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme color for mobile browser chrome -->
    <meta name="theme-color" content="#08080A" />

    <!-- PWA manifest — what makes the app installable -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA tags — makes "Add to Home Screen" open fullscreen, no Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MovieTracker" />

    <!-- Mobile viewport — covers the notch area on iPhone with safe-area-inset -->
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO + sharing -->
    <title>MovieTracker — Save the movies & shows you love</title>
    <meta name="description" content="Discover movies and TV shows, save your favorites, never forget what you've watched." />

    <!-- Open Graph for nice link previews when sharing -->
    <meta property="og:title" content="MovieTracker" />
    <meta property="og:description" content="Discover movies and TV shows, save your favorites, never forget what you've watched." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
